<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Set a goal, stake ether, and stay accountable with a mentor." />
    <title>CoinPledge</title>
    <script>
      // Restore deep links redirected by public/404.html (spa-github-pages, MIT).
      (function (location) {
        var query = new URLSearchParams(location.search);
        if (query.has('p') && /^\/(?![\/\\])/.test(query.get('p'))) {
          var path = query.get('p').replace(/~and~/g, '&');
          var search = query.get('q');
          window.history.replaceState(null, '', path + (search ? '?' + search.replace(/~and~/g, '&') : '') + location.hash);
        }
      })(window.location);
    </script>
    <script type="module" crossorigin src="/build.js"></script>
    <link rel="stylesheet" crossorigin href="/styles.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
