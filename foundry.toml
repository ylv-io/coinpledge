[profile.default]
src = 'contracts'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
auto_detect_remappings = false
solc = '0.8.37'
evm_version = 'osaka'
# Enforce Ethereum mainnet's EIP-7825 transaction gas cap in tests and scripts.
enable_tx_gas_limit = true
gas_limit = 16777216
optimizer = true
optimizer_runs = 200
remappings = [
  'forge-std/=lib/forge-std/src/',
  '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/'
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 100
tab_width = 2

[profile.default.lint]
# Run lint explicitly against production source; Forge build also includes test helpers.
lint_on_build = false
