[profile.default]
src = 'contracts'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
solc = '0.8.37'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
remappings = [
  'forge-std/=lib/forge-std/src/',
  '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/'
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 100
tab_width = 2
