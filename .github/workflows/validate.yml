name: Validate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge lint contracts/CoinPledge.sol
      - run: forge test
      - run: node scripts/test-export-contract.js
      - name: Check generated contract artifacts
        run: |
          node scripts/export-contract.js
          forge flatten contracts/CoinPledge.sol --output dist/Complete.sol
          git diff --exit-code -- build/contracts/CoinPledge.json dist/Complete.sol

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '10.24.1'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1
      - run: npm ci --no-audit
      - run: npm test -- --runInBand
      - run: ./node_modules/.bin/eslint src/js scripts
      - run: npm run build
      - name: Check local Forge and Web3 integration
        run: |
          anvil --host 127.0.0.1 --port 18545 --chain-id 31337 --hardfork cancun --silent &
          ANVIL_PID=$!
          trap 'kill "$ANVIL_PID"' EXIT
          for attempt in $(seq 1 50); do
            if cast rpc --rpc-url http://127.0.0.1:18545 eth_chainId >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          npm run test:integration
