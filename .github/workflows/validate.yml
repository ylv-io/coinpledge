name: Validate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge lint contracts/CoinPledge.sol
      - run: forge test
      - run: bun scripts/test-export-contract.js
      - name: Check generated browser contract artifact
        run: |
          bun scripts/export-contract.js
          git diff --exit-code -- build/contracts/CoinPledge.json

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: bunx --bun playwright install --with-deps chromium
      - name: Check local Forge, wallet adapter and browser integration
        run: |
          anvil --host 127.0.0.1 --port 18545 --chain-id 31337 \
            --hardfork osaka --enable-tx-gas-limit --silent &
          ANVIL_PID=$!
          trap 'kill "$ANVIL_PID"' EXIT
          for attempt in $(seq 1 50); do
            if cast rpc --rpc-url http://127.0.0.1:18545 eth_chainId >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          bun run test:integration
